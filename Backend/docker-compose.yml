version: '3.9'

services:
  # ── Infrastructure ──────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ── Services ────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway/EGreetings.Gateway/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - identity-service
      - greeting-service
      - subscription-service
      - admin-service
      - feedback-service
      - user-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  identity-service:
    build:
      context: .
      dockerfile: services/identity/EGreetings.Identity.API/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__Default=Data Source=egreetings_identity.db
      - RabbitMQ__Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  greeting-service:
    build:
      context: .
      dockerfile: services/greeting/EGreetings.Greeting.API/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__Default=Data Source=egreetings_greeting.db
      - RabbitMQ__Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  subscription-service:
    build:
      context: .
      dockerfile: services/subscription/EGreetings.Subscription.API/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ConnectionStrings__Default=Data Source=egreetings_subscription.db
      - RabbitMQ__Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: services/user/EGreetings.User.API/Dockerfile
    ports:
      - "5004:8080"
    environment:
      - ConnectionStrings__Default=Data Source=egreetings_user.db
      - RabbitMQ__Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: services/notification/EGreetings.Notification.API/Dockerfile
    ports:
      - "5005:8080"
    environment:
      - RabbitMQ__Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  admin-service:
    build:
      context: .
      dockerfile: services/admin/EGreetings.Admin.API/Dockerfile
    ports:
      - "5006:8080"
    environment:
      - ConnectionStrings__Default=Data Source=egreetings_admin.db
      - RabbitMQ__Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  feedback-service:
    build:
      context: .
      dockerfile: services/feedback/EGreetings.Feedback.API/Dockerfile
    ports:
      - "5007:8080"
    environment:
      - ConnectionStrings__Default=Data Source=egreetings_feedback.db
      - RabbitMQ__Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
