<div class="bg-background min-h-screen font-body text-on-background">
  <app-admin-sidebar />

  <main class="ml-64 min-h-screen p-12">
    <header class="flex justify-between items-end mb-8">
      <div>
        <nav class="flex gap-2 text-xs uppercase tracking-widest text-on-surface-variant mb-2">
          <span>Admin</span><span>/</span>
          <span class="text-primary font-bold">Manage Users</span>
        </nav>
        <h2 class="font-headline text-4xl font-bold text-on-surface">User Management</h2>
        <p class="text-on-surface-variant mt-2 max-w-xl text-sm">
          View registered users, manage accounts, and lock/unlock access.
        </p>
      </div>
      <div class="flex items-center gap-3">
        <button (click)="openCreateModal()"
                class="flex items-center gap-2 bg-primary text-on-primary text-sm px-4 py-2 rounded-lg shadow hover:bg-primary/90 transition-colors font-bold">
          <span class="material-symbols-outlined text-[20px]">person_add</span>
          Add User
        </button>
        <button (click)="loadUsers()"
                class="flex items-center gap-2 bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface text-sm px-4 py-2 rounded-lg border border-outline-variant/30 shadow-sm">
          <span class="material-symbols-outlined text-[20px]" [class.animate-spin]="loading()">refresh</span>
          Refresh
        </button>
      </div>
    </header>

    <div class="bg-surface-container-low rounded-xl p-4 mb-8 flex flex-wrap gap-4 items-end border border-outline-variant/20">
      <div class="flex flex-col gap-1.5 flex-1 min-w-[220px]">
        <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Search</label>
        <div class="relative">
          <input [(ngModel)]="filterSearch" (keyup.enter)="applyFilters()"
                 class="w-full bg-surface border border-outline-variant/30 rounded-lg pl-10 pr-4 py-2 text-sm focus:ring-2 focus:ring-primary/50 outline-none"
                 placeholder="Search by name or email..." type="text">
          <span class="material-symbols-outlined absolute left-3 top-2 text-outline text-[20px]">search</span>
        </div>
      </div>
      <div class="flex flex-col gap-1.5 w-36">
        <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Role</label>
        <select [(ngModel)]="filterRole"
                class="bg-surface border border-outline-variant/30 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary/50 outline-none w-full">
          <option value="">All roles</option>
          <option value="User">User</option>
          <option value="Admin">Admin</option>
        </select>
      </div>
      <div class="flex flex-col gap-1.5 w-40">
        <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Status</label>
        <select [(ngModel)]="filterAccountStatus"
                class="bg-surface border border-outline-variant/30 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary/50 outline-none w-full">
          <option value="">All statuses</option>
          <option value="Active">Active</option>
          <option value="Locked">Locked</option>
        </select>
      </div>
      <div class="flex flex-col gap-1.5 w-44">
        <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Subscription</label>
        <select [(ngModel)]="filterSubPlan"
                class="bg-surface border border-outline-variant/30 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary/50 outline-none w-full">
          <option value="">All plans</option>
          <option value="Free">🆓 Free</option>
          <option value="Monthly">📅 Monthly</option>
          <option value="Annual">🌟 Annual</option>
        </select>
      </div>
      <button (click)="applyFilters()"
              class="bg-primary text-on-primary px-5 py-2 rounded-lg text-sm font-bold shadow hover:bg-primary/90 transition-colors">
        Apply
      </button>
    </div>

    <app-user-list-table
      [users]="users()"
      [loading]="loading()"
      [meta]="meta()"
      (action)="handleTableAction($event)"
      (pageChange)="goToPage($event)" />
  </main>

  @if (showCreateModal()) {
    <app-user-create-modal
      [loading]="createLoading()"
      [errorMessage]="createError()"
      (submit)="submitCreate($event)"
      (close)="showCreateModal.set(false)" />
  }

  @if (selectedUserToEdit(); as u) {
    <app-user-edit-modal
      [user]="u"
      [loading]="editLoading()"
      [errorMessage]="editError()"
      (submit)="submitEdit($event)"
      (close)="selectedUserToEdit.set(null)" />
  }

  @if (selectedUserToDelete(); as u) {
    <app-user-delete-confirm-dialog
      [user]="u"
      [loading]="deleteLoading()"
      [errorMessage]="deleteError()"
      (confirm)="confirmDelete()"
      (cancel)="selectedUserToDelete.set(null)" />
  }

  @if (selectedUserToLock(); as u) {
    <app-user-lock-confirm-dialog
      [user]="u"
      (confirm)="confirmLock($event)"
      (cancel)="selectedUserToLock.set(null)" />
  }
</div>
