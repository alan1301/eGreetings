<div class="bg-surface min-h-screen font-body text-on-surface">
  <app-admin-sidebar />

  <main class="ml-64 p-10 min-h-screen">
    <!-- Header -->
    <header class="flex justify-between items-end mb-10">
      <div>
        <h1 class="font-headline italic text-4xl text-on-surface mb-2">Hello, Administrator.</h1>
        <p class="text-on-surface-variant font-body tracking-tight">Aurelian system overview · Live</p>
      </div>
      <div class="flex items-center gap-3">
        <button (click)="refresh()"
                class="flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container-low hover:bg-surface-container text-sm font-bold uppercase tracking-widest text-on-surface-variant transition-colors">
          <span class="material-symbols-outlined text-base"
                [class.animate-spin]="dashboard.loading()">refresh</span>
          Refresh
        </button>
        <div class="bg-surface-container-low px-5 py-2.5 rounded-xl">
          <div class="flex items-center gap-2 text-xs uppercase tracking-widest text-on-surface-variant font-bold mb-0.5">
            <span class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></span>
            Updated {{ lastUpdatedLabel() }}
          </div>
          <span class="text-base font-headline text-primary">{{ today }}</span>
        </div>
      </div>
    </header>

    @if (dashboard.error(); as err) {
      <div class="mb-6 p-4 rounded-xl bg-error-container/30 text-error text-sm">
        {{ err }}
      </div>
    }

    <!-- KPI strip -->
    <div class="grid grid-cols-12 gap-6 mb-6">
      <div class="col-span-3">
        <app-stat-card
          icon="mail" label="Sent Today" iconColor="text-primary"
          [value]="dashboard.overview()?.sentToday ?? null"
          [previous]="dashboard.overview()?.sentYesterday ?? null"
          [sparkline]="dashboard.overview()?.sentSparkline ?? []"
          link="/admin/logs"
          [queryParams]="{ eventType: 'SendCard' }" />
      </div>
      <div class="col-span-3">
        <app-stat-card
          icon="workspace_premium" label="Active Subs" iconColor="text-secondary"
          [value]="dashboard.overview()?.activeSubscriptions ?? null"
          [sparkline]="dashboard.overview()?.activeSubscriptionsSparkline ?? []"
          link="/admin/subscriptions"
          [queryParams]="{ status: 'Active' }" />
      </div>
      <div class="col-span-3">
        <app-stat-card
          icon="pending_actions" label="Pending Payments" iconColor="text-on-error-container"
          [value]="dashboard.overview()?.pendingPayments ?? null"
          [sparkline]="dashboard.overview()?.pendingPaymentsSparkline ?? []"
          link="/admin/subscriptions"
          [queryParams]="{ status: 'Pending' }" />
      </div>
      <div class="col-span-3">
        <app-stat-card
          icon="forum" label="Unread Feedback" iconColor="text-tertiary"
          [value]="dashboard.overview()?.unreadFeedbacks ?? null"
          [sparkline]="dashboard.overview()?.unreadFeedbacksSparkline ?? []"
          link="/admin/feedback"
          [queryParams]="{ status: 'Unread' }" />
      </div>
    </div>

    <!-- Charts row -->
    <div class="grid grid-cols-12 gap-6 mb-6">
      <div class="col-span-8">
        <app-trend-chart
          [data]="dashboard.timeseries()"
          [range]="dashboard.range()"
          (rangeChange)="onRangeChange($event)" />
      </div>
      <div class="col-span-4">
        <app-funnel-widget [data]="dashboard.funnel()" />
      </div>
    </div>

    <!-- Operational row -->
    <div class="grid grid-cols-12 gap-6">
      <div class="col-span-5">
        <app-activity-feed
          [items]="dashboard.activity()"
          (action)="onActivityAction($event)" />
      </div>
      <div class="col-span-4">
        <app-top-cards-widget [items]="dashboard.topCards()" />
      </div>
      <div class="col-span-3 space-y-6">
        <app-quick-actions />
        <app-health-widget [data]="dashboard.health()" />
      </div>
    </div>
  </main>
</div>
