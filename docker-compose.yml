services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: egreetings_sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - egreetings_net
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -No -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: egreetings_mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - egreetings_net
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: egreetings_backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=EGreetingsDb_Dev;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      SmtpSettings__Host: "${SMTP_HOST:-mailhog}"
      SmtpSettings__Port: "${SMTP_PORT:-1025}"
      SmtpSettings__EnableSsl: "false"
      SmtpSettings__UserName: "${SMTP_USERNAME:-}"
      SmtpSettings__Password: "${SMTP_PASSWORD:-}"
      SmtpSettings__FromEmail: "${SMTP_FROM_EMAIL:-noreply@egreetings.local}"
      SmtpSettings__FromName: "${SMTP_FROM_NAME:-eGreetings Dev}"
    ports:
      - "5059:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - egreetings_net
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: egreetings_frontend
    ports:
      - "4300:80"
    depends_on:
      - backend
    networks:
      - egreetings_net
    restart: unless-stopped

volumes:
  sqldata:

networks:
  egreetings_net:
    driver: bridge
